<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propuesta Académica 2027 — Colegio Santo Tomás</title>
<meta name="description" content="Propuesta Académica 2027 del Colegio Santo Tomás. Nivel Primario y Nivel Secundario. Belén de Escobar, Buenos Aires.">
<meta name="theme-color" content="#00669c">
<link rel="icon" href="assets/isotipo.svg">
<meta property="og:title" content="Propuesta Académica 2027 — Colegio Santo Tomás">
<meta property="og:description" content="Nivel Primario y Nivel Secundario: horarios, materias, aranceles e inscripción 2027.">
<meta property="og:image" content="assets/isotipo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=Livvic:ital,wght@0,300;0,400;0,600;0,700;1,400&family=M+PLUS+Rounded+1c:wght@700;800&family=Caveat+Brush&display=swap" rel="stylesheet">

<style>
/* ==========================================================
   Colegio Santo Tomás — sistema del manual de marca
   Paleta corporativa · Fraunces (títulos) · Livvic (texto)
   Gladiola (acentos manuscritos) · M PLUS Rounded 1c (logotipo)
   ========================================================== */
:root{
  --azul:#00669c;
  --celeste:#55a1d9;
  --rojo:#e41a22;
  --verde:#50b32b;
  --naranja:#f99c02;
  --violeta:#8f3f9c;
  --papel:#f4edec;
  --blanco:#ffffff;
  --tinta:#241f22;
  --tinta-suave:#5d5459;
  --linea:#e2d6d4;
  --acento:var(--azul);
  --radio:20px;

  --tipo-titulo:Fraunces,Georgia,"Times New Roman",serif;
  --tipo-texto:Livvic,"Segoe UI",system-ui,-apple-system,sans-serif;
  --tipo-mano:Gladiola,"Caveat Brush",cursive;
  --tipo-logo:"M PLUS Rounded 1c",Livvic,sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papel); color:var(--tinta);
  font-family:var(--tipo-texto); font-size:16.5px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
#doc{max-width:760px; margin:0 auto; background:var(--blanco); position:relative; overflow:hidden}

/* ---------- barra ---------- */
.barra{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px;
  padding:9px 14px; background:rgba(255,255,255,.96); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--linea);
}
.barra img{width:36px; height:36px; flex:0 0 auto}
.barra .marca{flex:1; min-width:0; line-height:1.1}
.barra .marca b{font-family:var(--tipo-logo); font-weight:800; font-size:14.5px; color:var(--azul); display:block; letter-spacing:-.01em}
.barra .marca span{font-size:11.5px; color:var(--tinta-suave)}
.btn{
  font-family:var(--tipo-texto); font-weight:600; font-size:13.5px;
  border:1.5px solid var(--linea); background:#fff; color:var(--tinta-suave);
  border-radius:999px; padding:8px 15px; cursor:pointer; white-space:nowrap;
}
.btn:hover{border-color:var(--azul); color:var(--azul)}
.btn.activo{background:var(--azul); border-color:var(--azul); color:#fff}
.btn.chico{padding:6px 12px; font-size:12.5px}
.btn:focus-visible,[contenteditable]:focus-visible,a:focus-visible{outline:3px solid var(--naranja); outline-offset:2px}

.nav{
  display:flex; gap:7px; overflow-x:auto; padding:9px 14px; background:#fff;
  border-bottom:1px solid var(--linea); position:sticky; top:55px; z-index:39; scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav a{
  flex:0 0 auto; text-decoration:none; color:var(--tinta-suave); font-size:13px;
  font-weight:600; padding:6px 13px; border-radius:999px; background:var(--papel);
}

/* ---------- portada ---------- */
.portada{position:relative; padding:34px 22px 38px; background:var(--papel); overflow:hidden}
.portada .piezas{position:absolute; right:-52px; top:-42px; width:210px; opacity:.09; pointer-events:none}
.portada > *:not(.piezas){position:relative; z-index:1}
.portada .sello{width:104px; height:104px; display:block; margin-bottom:20px}
.portada h1{
  font-family:var(--tipo-titulo); font-weight:900; font-size:clamp(40px,12vw,62px);
  line-height:.95; letter-spacing:-.03em; margin:0; color:var(--azul);
}
.portada .anio{
  font-family:var(--tipo-titulo); font-weight:900; font-size:clamp(52px,17vw,88px);
  line-height:.9; color:var(--rojo); margin-top:6px; letter-spacing:-.04em;
}
.mosaico{display:flex; gap:6px; margin:22px 0}
.mosaico i{height:9px; border-radius:3px; flex:1}

/* ---------- secciones ---------- */
section{padding:34px 22px 36px; position:relative; background:var(--blanco)}
section.tinte{background:var(--papel)}
h2{
  font-family:var(--tipo-titulo); font-weight:700; font-size:28px; line-height:1.12;
  letter-spacing:-.02em; margin:0 0 8px; color:var(--acento);
}
.subrayado{width:52px; height:6px; border-radius:3px; background:var(--acento); margin:0 0 18px}
h3{font-family:var(--tipo-texto); font-weight:700; font-size:17px; margin:0 0 3px; color:var(--tinta)}
p{margin:0 0 12px; max-width:60ch}
.entrada{font-size:17px; font-weight:600; margin-bottom:18px; max-width:56ch}
.item{display:flex; gap:12px; margin:0 0 18px; align-items:flex-start}
.item .cuerpo{flex:1; min-width:0}
.item .cuerpo p{margin:0; color:var(--tinta-suave); font-size:15.5px}
.punto{
  flex:0 0 auto; width:18px; height:18px; margin-top:5px; background:var(--acento);
  border-radius:6px 6px 6px 2px;
}
.pasos{margin:0; padding:0; list-style:none}
.pasos li{display:flex; gap:14px; margin-bottom:20px; align-items:flex-start}
.pasos .num{
  flex:0 0 auto; width:42px; height:42px; display:grid; place-items:center; color:#fff;
  font-family:var(--tipo-titulo); font-weight:900; font-size:19px; border-radius:13px 13px 13px 4px;
}
.destacado{background:var(--acento); color:#fff; border-radius:var(--radio); padding:20px; margin:0 0 20px}
.destacado h3{color:#fff; font-size:18px}
.destacado p{color:rgba(255,255,255,.94); margin-bottom:8px}
.destacado p:last-child{margin-bottom:0}
.suave{background:#fff; border:1.5px solid var(--linea); border-radius:var(--radio); padding:16px 18px; margin:0 0 20px}
.aviso{font-size:14.5px; color:var(--tinta-suave); max-width:58ch}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 18px}
.chip{
  background:#fff; border:1.5px solid var(--linea); border-radius:12px; padding:7px 14px;
  font-weight:600; font-size:14.5px; display:inline-flex; align-items:center; gap:8px;
}
.chip i{width:10px; height:10px; border-radius:3px; background:var(--acento)}
.lista{margin:0; padding:0; list-style:none}
.lista li{display:flex; gap:11px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--linea); font-size:15.5px}
.lista li:last-child{border-bottom:0}
.lista .tic{flex:0 0 auto; width:14px; height:14px; margin-top:6px; border-radius:4px 4px 4px 1px; background:var(--acento)}
.cita{
  font-family:var(--tipo-mano); font-size:25px; line-height:1.25; color:#fff; margin:0 0 6px;
}

.contactos{display:grid; gap:10px}
.contacto{
  display:flex; align-items:center; gap:13px; text-decoration:none; color:#fff;
  border-radius:15px; padding:14px 16px; font-weight:600; font-size:16px;
  background:var(--acento); word-break:break-word;
}
.contacto .ic{flex:0 0 auto; width:34px; height:34px; border-radius:11px; background:rgba(255,255,255,.24); display:grid; place-items:center; font-size:16px}
.contacto small{display:block; font-weight:400; font-size:12.5px; opacity:.9}

.verano{background:var(--celeste); color:#fff; border-radius:24px; padding:26px 22px}
.verano h2{color:#fff}
.verano .subrayado{background:var(--naranja)}
.verano .lista li{border-color:rgba(255,255,255,.32); color:#fff}
.verano .lista .tic{background:var(--naranja)}
.verano .cajas{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}
.verano .caja{background:rgba(255,255,255,.2); border-radius:15px; padding:13px 16px; flex:1; min-width:135px}
.verano .caja b{font-family:var(--tipo-titulo); font-weight:700; font-size:21px; display:block}
.verano .caja span{font-size:12.5px; opacity:.92}

.cierre{background:var(--azul); color:#fff; padding:38px 22px 42px; text-align:center}
.cierre img{width:82px; height:82px; margin-bottom:18px; background:#fff; border-radius:22px; padding:8px}
.cierre .frase{font-family:var(--tipo-mano); font-size:30px; line-height:1.2; max-width:16ch; margin:0 auto}
.cierre .autor{margin-top:8px; font-size:14px; color:rgba(255,255,255,.75)}
.cierre .pie-datos{margin-top:24px; font-size:13px; color:rgba(255,255,255,.7); line-height:1.75}

/* ---------- modo edición ---------- */
[contenteditable="true"]{
  outline:none; border-radius:5px; cursor:text;
  box-shadow:inset 0 -2px 0 rgba(0,102,156,.4); background:rgba(0,102,156,.06);
}
[contenteditable="true"]:hover{background:rgba(0,102,156,.13)}
[contenteditable="true"]:empty::before{content:"Escribí acá…"; color:#a89ea1}
.destacado [contenteditable="true"],.contacto [contenteditable="true"],.verano [contenteditable="true"],.cierre [contenteditable="true"]{
  box-shadow:inset 0 -2px 0 rgba(255,255,255,.6); background:rgba(255,255,255,.18);
}
.fila-edit{display:none; gap:6px; margin:-10px 0 18px}
.editando .fila-edit{display:flex}
.mini{
  border:1.5px dashed #cbbcb9; background:#fff; color:var(--tinta-suave);
  font-family:var(--tipo-texto); font-size:12.5px; font-weight:600;
  border-radius:999px; padding:5px 11px; cursor:pointer;
}
.mini:hover{border-color:var(--azul); color:var(--azul)}
.quitar{display:none; flex:0 0 auto; border:0; background:transparent; cursor:pointer; color:#bdb0ad; font-size:19px; line-height:1; padding:2px 4px}
.editando .quitar{display:block}
.quitar:hover{color:var(--rojo)}
.destacado .quitar,.verano .quitar{color:rgba(255,255,255,.8)}
.pie{
  position:sticky; bottom:0; z-index:41; display:none; gap:8px; align-items:center;
  padding:10px 14px; background:rgba(255,255,255,.97); border-top:1px solid var(--linea); overflow-x:auto;
}
.editando .pie{display:flex}
.estado{font-size:12.5px; color:var(--tinta-suave); margin-left:auto; white-space:nowrap}

.velo{position:fixed; inset:0; background:rgba(36,31,34,.62); z-index:60; display:none; align-items:center; justify-content:center; padding:16px}
.velo.abierto{display:flex}
.modal{background:#fff; border-radius:20px; padding:20px; width:100%; max-width:560px}
.modal h3{font-family:var(--tipo-titulo); font-weight:700; font-size:20px; margin-bottom:6px}
.modal p{font-size:14px; color:var(--tinta-suave)}
.modal textarea{width:100%; height:230px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; border:1.5px solid var(--linea); border-radius:12px; padding:11px; resize:vertical}
.modal .acciones{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}



/* ==========================================================
   Cita de apertura
   Es larga: necesita su propia banda y un cuerpo legible.
   ========================================================== */
.banda-cita{background:var(--violeta); color:#fff; padding:38px 22px 34px; position:relative}
.banda-cita .comilla{
  font-family:var(--tipo-titulo); font-weight:900; font-size:96px; line-height:.6;
  color:rgba(255,255,255,.28); display:block; margin-bottom:-6px;
}
.banda-cita blockquote{
  margin:0; font-family:var(--tipo-titulo); font-style:italic; font-weight:400;
  font-size:20px; line-height:1.45; max-width:44ch;
}
.banda-cita figcaption{margin-top:18px; font-size:14px; line-height:1.5; color:rgba(255,255,255,.82)}
.banda-cita figcaption b{display:block; font-weight:600; color:#fff}

/* ==========================================================
   Selector de nivel
   ========================================================== */
.selector{background:var(--papel); padding:24px 22px 26px; border-bottom:1px solid var(--linea)}
.selector .rotulo{font-size:14.5px; color:var(--tinta-suave); margin:0 0 12px; max-width:46ch}
.selector .botones{display:flex; gap:10px; flex-wrap:wrap}
.nivel-btn{
  flex:1; min-width:150px; cursor:pointer; font-family:var(--tipo-texto);
  font-size:16px; font-weight:700; padding:14px 18px; text-align:left;
  border:2px solid var(--linea); background:#fff; color:var(--tinta-suave);
  border-radius:15px 15px 15px 4px;
}
.nivel-btn small{display:block; font-weight:400; font-size:12.5px; opacity:.75}
.nivel-btn:hover{border-color:var(--azul)}
.nivel-btn.activo{background:var(--azul); border-color:var(--azul); color:#fff}
.nivel-btn.activo small{opacity:.9}

/* ==========================================================
   Marcos de foto
   Recorte con la esquina viva del isotipo. La foto se encaja
   sola: se recorta al centro, nunca se deforma.
   ========================================================== */
.marco{
  position:relative; margin:0 0 16px; overflow:hidden; background:var(--papel);
  border-radius:22px 22px 22px 6px; aspect-ratio:4/3;
}
.marco img{width:100%; height:100%; object-fit:cover; display:block}
.marco .vacio{
  width:100%; height:100%; display:grid; place-items:center; text-align:center;
  color:var(--tinta-suave); font-size:14px; font-weight:600;
  border:2px dashed #cbbcb9; border-radius:inherit;
}
.marco-alto{aspect-ratio:3/4}
.marco-cuadrado{aspect-ratio:1/1; margin:0}
.marco-ficha{aspect-ratio:4/3; margin:0 0 12px}
.acciones-foto{
  position:absolute; left:8px; right:8px; bottom:8px;
  display:flex; gap:6px; flex-wrap:wrap;
}
.foto-btn{
  font-family:var(--tipo-texto); font-size:12px; font-weight:600; cursor:pointer;
  border:0; border-radius:999px; padding:6px 11px;
  background:rgba(36,31,34,.82); color:#fff; backdrop-filter:blur(4px);
}
.foto-btn:hover{background:var(--azul)}
.tira-fotos{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px}
.tira-fotos .marco{margin:0}
.mosaico-fotos{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px}
.celda{position:relative}
.celda .quitar{position:absolute; top:4px; right:4px; background:rgba(36,31,34,.75); color:#fff; border-radius:50%; width:26px; height:26px; line-height:1}
.item.con-foto{flex-direction:column; gap:0}
.item.con-foto .cuerpo{width:100%}

/* ==========================================================
   Pantallas medianas y grandes
   El celular es la base; acá el contenido se reparte a lo ancho
   sin que las líneas de texto se vuelvan ilegibles.
   ========================================================== */
@media (min-width:700px){
  section{padding:44px 40px 46px}
  .portada{padding:48px 40px 50px}
  h2{font-size:32px}
  .contactos{grid-template-columns:1fr 1fr}
  .verano{padding:32px 30px}
}

@media (min-width:960px){
  body{font-size:17px}
  #doc{max-width:1080px; box-shadow:0 0 0 1px var(--linea)}
  section{padding:56px 56px 60px}
  h2{font-size:36px}
  .entrada{font-size:19px}

  /* portada en dos columnas: el texto a la izquierda, el isotipo grande */
  .portada{
    display:grid; grid-template-columns:minmax(0,1fr) auto;
    column-gap:48px; align-items:start; padding:64px 56px 66px;
  }
  .portada h1{grid-column:1; grid-row:1; font-size:64px}
  .portada .anio{grid-column:1; grid-row:2; font-size:96px}
  .portada .sello{grid-column:1; grid-row:3; width:104px; height:104px; margin:18px 0 0}
  .portada .mosaico{grid-column:1; grid-row:4}
  .portada .piezas{width:300px; right:-80px; top:-70px}

  /* bloques que ganan al leerse en paralelo */
  .grilla{display:grid; grid-template-columns:1fr 1fr; column-gap:32px}
  .banda-cita{padding:52px 56px 46px}
  .banda-cita blockquote{font-size:26px}
  .selector{padding:30px 56px 32px}
  .mosaico-fotos{grid-template-columns:repeat(4,1fr)}
  .portada .marco{grid-column:2; grid-row:1 / span 4; width:280px; aspect-ratio:3/4; align-self:center; margin:0}
  .lista{display:grid; grid-template-columns:1fr 1fr; column-gap:36px}
  .lista li:nth-last-child(2):nth-child(odd){border-bottom:0}
  .verano .lista{column-gap:30px}
  .destacado{padding:26px 28px}
  .cierre{padding:56px 40px 60px}
  .cierre .frase{font-size:36px; max-width:20ch}
}

/* el texto nunca se estira más allá de lo cómodo de leer */
@media (min-width:1140px){
  #doc{max-width:1120px}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
@media print{
  .barra,.nav,.pie,.fila-edit,.quitar,.velo{display:none!important}
  body{background:#fff} #doc{max-width:none}
  section{break-inside:avoid}
  [contenteditable]{box-shadow:none!important; background:transparent!important}
}
</style>
</head>
<body>

<div id="doc">
  <header class="barra">
    <img src="assets/isotipo.svg" alt="Isotipo del Colegio Santo Tomás">
    <div class="marca" id="marcaTop"></div>
    <button class="btn chico" id="btnImprimir">Imprimir</button>
    <button class="btn chico" id="btnEditar">Editar</button>
  </header>
  <nav class="nav" id="nav"></nav>
  <main id="app"></main>
  <div class="pie">
    <button class="btn chico" id="btnExportar">Exportar contenido</button>
    <button class="btn chico" id="btnImportar">Importar</button>
    <button class="btn chico" id="btnReset">Restablecer</button>
    <span class="estado" id="estado">Sin cambios</span>
  </div>
</div>

<input type="file" id="archivoFoto" accept="image/*" hidden>

<div class="velo" id="velo">
  <div class="modal">
    <h3 id="modalTitulo"></h3>
    <p id="modalTexto"></p>
    <textarea id="modalCampo" spellcheck="false"></textarea>
    <div class="acciones">
      <button class="btn" id="modalPrimario"></button>
      <button class="btn" id="modalCerrar">Cerrar</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   1. CONTENIDO — todo el texto de la propuesta vive acá
   ============================================================ */
const BASE = {
  "escuela": "Colegio Santo Tomás",
  "barrio": "Barrio Lambertuchi · Belén de Escobar",
  "titulo": "Propuesta Académica",
  "anio": "2027",
  "fotoPortada": "assets/fotos/portada.jpg",
  "verso": "\"La innovación educativa se construye sobre lo que ya hacemos y tenemos, valorando aquello que es importante conservar. Y que, al mismo tiempo, nos propone estirarnos un poco más lejos, buscando que la escuela se transforme en un espacio propicio para la aventura del pensamiento\"",
  "versoObra": "Las Preguntas Educativas entran a las aulas",
  "versoAutor": "Melina Furman y María Emilia Larsen",
  "mision": {
    "titulo": "Nuestra misión: educación de calidad",
    "parrafos": [
      "Los profesionales de la educación que formamos parte del Colegio Santo Tomás tenemos como misión brindar una Educación de Calidad donde el bienestar en comunidad, las distintas formas de enseñar y aprender, los recursos didácticos y las tecnologías educativas son condición necesaria para lograr más y mejores aprendizajes."
    ]
  },
  "calidades": {
    "titulo": "Las tres calidades",
    "items": [
      {
        "titulo": "La calidad humana",
        "texto": "El desarrollo del estudiante no es solo académico: también es emocional, social, ético y ciudadano. Cuidamos el clima de convivencia, prevenimos el acoso escolar y sostenemos el bienestar de estudiantes y docentes."
      },
      {
        "titulo": "La calidad de los aprendizajes",
        "texto": "Miramos los resultados, pero también los procesos: la eficacia de los métodos de enseñanza, la evaluación formativa, y el desarrollo del pensamiento crítico, la resolución de problemas, la creatividad y la colaboración."
      },
      {
        "titulo": "La calidad de los recursos",
        "texto": "La selección, la formación y el bienestar del equipo docente, la infraestructura y las herramientas digitales son las que sostienen todo lo anterior."
      }
    ]
  },
  "compromiso": {
    "titulo": "Nuestro compromiso",
    "parrafos": [
      "Los docentes y profesionales que formamos parte del Colegio Santo Tomás nos comprometemos a desplegar procesos educativos que favorezcan la inclusión de niños y niñas en su diversidad, considerando todas sus diferencias, por medio de acciones educativas enmarcadas en los valores fundamentales de igualdad y libertad.",
      "A su vez, buscamos generar prácticas institucionales que promuevan la solidaridad y el respeto mutuo, que posibiliten la aproximación de los niños y niñas a la heterogeneidad, para asegurar el éxito en los aprendizajes de todos nuestros y nuestras estudiantes."
    ]
  },
  "pedagogia": {
    "titulo": "Cómo enseñamos",
    "intro": "Nuestra propuesta pedagógica se apoya en cuatro decisiones.",
    "items": [

/* ============================================================
   2. Estado y guardado
   ============================================================ */
const CLAVE = "propuesta-academica-2027";
let datos = JSON.parse(JSON.stringify(BASE));
let editando = false, temporizador = null;
let nivelActivo = "primaria";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* funciona igual dentro del chat que publicado en la web */
const almacen = {
  async leer(){
    if (window.storage) { const r = await window.storage.get(CLAVE); return r && r.value; }
    return localStorage.getItem(CLAVE);
  },
  async escribir(v){
    if (window.storage) return window.storage.set(CLAVE, v);
    localStorage.setItem(CLAVE, v);
  }
};

function leer(ruta){ return ruta.split(".").reduce((o,k)=> o==null?o:o[k], datos); }
function escribir(ruta, valor){
  const p = ruta.split(".");
  const ult = p.pop();
  p.reduce((o,k)=>o[k], datos)[ult] = valor;
}
function ed(ruta, tag="span", clase=""){
  return `<${tag}${clase?` class="${clase}"`:""} data-ruta="${ruta}"${editando?' contenteditable="plaintext-only"':''}>${esc(leer(ruta))}</${tag}>`;
}
const estado = t => $("#estado").textContent = t;

function guardar(){
  clearTimeout(temporizador);
  temporizador = setTimeout(async ()=>{
    estado("Guardando…");
    try{ await almacen.escribir(JSON.stringify(datos)); estado("Guardado"); }
    catch(e){ estado("No se pudo guardar. Exportá el contenido"); }
  }, 500);
}
async function cargar(){
  try{
    const v = await almacen.leer();
    if(v) datos = Object.assign(JSON.parse(JSON.stringify(BASE)), JSON.parse(v));
  }catch(e){}
}

const agregarBtn = (ruta, etiqueta) => `<div class="fila-edit"><button class="mini" data-agregar="${ruta}">+ ${etiqueta}</button></div>`;
const quitarBtn  = (ruta, i) => `<button class="quitar" data-quitar="${ruta}" data-i="${i}" aria-label="Quitar">×</button>`;
const parrafos   = (ruta, arr, clase="") => arr.map((_,i)=>`<div class="item">${ed(ruta+"."+i,"p",i===0?clase:"")}${quitarBtn(ruta,i)}</div>`).join("");
const puntos     = (ruta, arr) => `<ul class="lista">${arr.map((_,i)=>`<li><span class="tic"></span><div style="flex:1">${ed(ruta+"."+i,"span")}</div>${quitarBtn(ruta,i)}</li>`).join("")}</ul>`;
const fichas     = (ruta, arr) => `<div class="grilla">` + arr.map((_,i)=>{
  const f = marco(ruta+"."+i+".foto","marco-ficha");
  return `<div class="item ${f?"con-foto":""}">${f || '<span class="punto"></span>'}<div class="cuerpo">${ed(ruta+"."+i+".titulo","h3")}${ed(ruta+"."+i+".texto","p")}</div>${quitarBtn(ruta,i)}</div>`;
}).join("") + `</div>`;


/* un marco de foto: muestra la imagen y, en modo edición, deja cambiarla */
function marco(ruta, clase="", borrable=true){
  const src = leer(ruta);
  if(!src && !editando) return "";
  const acciones = editando ? `<div class="acciones-foto">
      <button class="foto-btn" data-subir="${ruta}">${src?"Cambiar foto":"Agregar foto"}</button>
      <button class="foto-btn" data-urlfoto="${ruta}">Enlace</button>
      ${src && borrable ? `<button class="foto-btn" data-quitarfoto="${ruta}">Quitar</button>` : ""}
    </div>` : "";
  return `<figure class="marco ${clase}">
    ${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : `<div class="vacio">Sin foto</div>`}
    ${acciones}
  </figure>`;
}

  const el = e.target.closest("[data-ruta]");

});

document.addEventListener("click", e=>{
  const nivel = e.target.closest("[data-nivel]");
  if(nivel){
    nivelActivo = nivel.dataset.nivel;
    render();
    document.getElementById("s-niveles").scrollIntoView({block:"start"});
    return;
  }
  const add = e.target.closest("[data-agregar]");
  if(add){
    const ruta = add.dataset.agregar, arr = leer(ruta), modelo = arr[0];
    arr.push(modelo && typeof modelo === "object"
      ? Object.fromEntries(Object.keys(modelo).map(k=>[k,""])) : "");
    render(); guardar();
    const nuevo = document.querySelector(`[data-ruta^="${ruta}.${arr.length-1}"]`);
    if(nuevo) nuevo.focus();
    return;
  }
  const del = e.target.closest("[data-quitar]");
  if(del){ leer(del.dataset.quitar).splice(Number(del.dataset.i),1); render(); guardar(); return; }
  if(editando && e.target.closest("a.contacto")) e.preventDefault();
});

/* ---------- fotos ----------
   Las imágenes que se suben desde el dispositivo se achican antes de
   guardarse: una foto de celular pesa varios megas y el navegador solo
   reserva unos pocos para toda la propuesta. */
let rutaFoto = null;

function comprimir(archivo, ladoMax = 1200, calidad = 0.72){
  return new Promise((resolver, rechazar)=>{
    const lector = new FileReader();
    lector.onload = () => {
      const img = new Image();
      img.onload = () => {
        let {width:a, height:b} = img;
        const escala = Math.min(1, ladoMax / Math.max(a, b));
        a = Math.round(a * escala); b = Math.round(b * escala);
        const lienzo = document.createElement("canvas");
        lienzo.width = a; lienzo.height = b;
        lienzo.getContext("2d").drawImage(img, 0, 0, a, b);
        resolver(lienzo.toDataURL("image/jpeg", calidad));
      };
      img.onerror = () => rechazar(new Error("imagen ilegible"));
      img.src = lector.result;
    };
    lector.onerror = () => rechazar(new Error("archivo ilegible"));
    lector.readAsDataURL(archivo);
  });
}

document.addEventListener("click", e=>{
  const subir = e.target.closest("[data-subir]");
  if(subir){ rutaFoto = subir.dataset.subir; $("#archivoFoto").click(); return; }

  const quitarF = e.target.closest("[data-quitarfoto]");
  if(quitarF){ escribir(quitarF.dataset.quitarfoto, ""); render(); guardar(); return; }

  const enlace = e.target.closest("[data-urlfoto]");
  if(enlace){
    const ruta = enlace.dataset.urlfoto;
    modal({
      titulo:"Foto desde un enlace",
      texto:"Pegá la dirección de una imagen que ya esté publicada en internet. También sirve la ruta de un archivo del repositorio, por ejemplo assets/fotos/patio.jpg",
      valor: leer(ruta) && !String(leer(ruta)).startsWith("data:") ? leer(ruta) : "",
      boton:"Usar esta foto",
      alConfirmar: ()=>{
        escribir(ruta, $("#modalCampo").value.trim());
        render(); guardar(); $("#velo").classList.remove("abierto");
      }
    });
  }
});

$("#archivoFoto").addEventListener("change", async e=>{
  const archivo = e.target.files[0];
  if(!archivo || !rutaFoto) return;
  estado("Preparando la foto…");
  try{
    escribir(rutaFoto, await comprimir(archivo));
    render(); guardar();
  }catch(err){
    estado("Ese archivo no se pudo leer como imagen");
  }
  e.target.value = "";
});

(async ()=>{ await cargar(); render(); })();
